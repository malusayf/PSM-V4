services:
  - type: web
    name: psm-v4-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PSM_ALLOWED_ORIGINS
        value: http://localhost:3000
